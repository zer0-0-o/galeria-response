<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>LOGO</h1>
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#galeria">Galeria</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>
    
    <section id="inicio">
        <img src="./images/person.png" alt="Imagen Personal">

        <a href="#galeria">Here's some of my work</a>

    <section id="galeria">
        <div class="imagen" data-content="Bosque">

        <div class="imagen" data-content="Flores">

        </div>
        <div class="imagen" data-content="Gotas">

        </div>
        <div class="imagen" data-content="Laptop">

        </div>
        <div class="imagen" data-content="Libro">
            <img src="./images/libro.jpg">
        </div>
        <div class="imagen" data-content="Mountain">
            <img src="./images/mountain.jpg">
        </div>
        <div class="imagen" data-content="Playa">
            <img src="./images/playa.jpg">
        </div>
    </section>

    <section id="contacto">
        <h1>Contact Me!</h1>
        <h2>Name</h2>
        <input type="text" >
        <div></div>
        <h2>Email</h2>
        <input type="email" >
        <div></div>

        <textarea type="text" ></textarea>
    </section>
